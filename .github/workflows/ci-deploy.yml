name: ci-deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. The deploy job raises its own permissions, so pull
# request runs never carry Pages deploy credentials.
permissions:
  contents: read

# Concurrency is per job, not workflow-wide: a workflow-level
# cancel-in-progress cancels the whole run, deploy included, which no
# job-level group can protect against.
jobs:
  validate:
    runs-on: ubuntu-latest
    # Superseded runs on the same ref cancel each other, so a busy PR does not
    # queue up stale validations. Grouped per ref so a PR never touches main.
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancelled: a cancel landing inside actions/deploy-pages can leave
    # the Pages deployment half-applied. Back-to-back merges queue and publish
    # in order instead, so the last one still wins.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
